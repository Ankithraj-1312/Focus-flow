<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>FocusFlow AI | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --primary: #818cf8;
            --secondary: #c084fc;
            --accent: #22d3ee;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --danger: #f43f5e;
            --success: #22c55e;
            --pin: #fbbf24;
            --ai-glow: rgba(129, 140, 248, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(129, 140, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(192, 132, 252, 0.15) 0px, transparent 50%);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            /* FIX: safe-area for iPhone notch/home bar */
            padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px));
        }

        .app-container {
            width: 100%;
            max-width: 650px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 1rem;
        }

        .nav-logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .user-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .date-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .live-clock h2 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1;
        }

        .live-clock p {
            opacity: 0.6;
            font-size: 0.9rem;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ai-banner {
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.2), rgba(192, 132, 252, 0.2));
            border: 1px solid var(--primary);
            padding: 15px 20px;
            border-radius: 20px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            animation: pulse 4s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0px var(--ai-glow);
            }

            50% {
                box-shadow: 0 0 20px var(--ai-glow);
            }

            100% {
                box-shadow: 0 0 0px var(--ai-glow);
            }
        }

        .ai-banner p {
            font-size: 0.9rem;
            font-weight: 500;
            flex: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card span {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text);
        }

        .timeline {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .day-tab {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 20px;
            min-width: 100px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .day-tab span {
            display: block;
            font-size: 0.7rem;
            opacity: 0.5;
            text-transform: uppercase;
            font-weight: 700;
        }

        .day-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 10px 15px -5px rgba(129, 140, 248, 0.4);
        }

        #task-list {
            list-style: none;
            margin-top: 1rem;
        }

        .task-card {
            background: var(--card-bg);
            padding: 1.2rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            transition: 0.3s;
            position: relative;
        }

        .task-card.is-pinned {
            border-color: var(--pin);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }

        .task-card.completed {
            opacity: 0.4;
        }

        .task-card.completed .task-text {
            text-decoration: line-through;
        }

        .check-circle {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .check-circle.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .task-content {
            flex: 1;
            margin: 0 15px;
            cursor: grab;
        }

        .task-content:active {
            cursor: grabbing;
        }

        .task-text {
            display: block;
            font-size: 1.05rem;
            font-weight: 500;
        }

        /* Edit mode */
        .task-edit-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--primary);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 8px;
            padding: 4px 8px;
            width: 100%;
            outline: none;
        }

        .tag {
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 5px;
        }

        .actions {
            display: flex;
            gap: 4px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: #64748b;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: var(--text);
        }

        .pin-btn.active {
            color: var(--pin);
        }

        .edit-btn.active {
            color: var(--primary);
        }

        .calendar-wrapper {
            margin-top: 10px;
            padding: 15px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            display: none;
            margin-bottom: 10px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .cal-date {
            padding: 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cal-date:hover {
            background: rgba(129, 140, 248, 0.15);
        }

        .cal-date.active {
            background: var(--primary);
            color: white;
        }

        .cal-date.today {
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .cal-date.today.active {
            color: white;
        }

        /* FIX: Use sticky bottom bar instead of fixed to avoid iOS keyboard issues */
        .glass-input-box {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 610px;
            background: rgba(15, 23, 42, 0.97);
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom, 0px));
            border-radius: 24px 24px 0 0;
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-bottom: none;
            box-shadow: var(--shadow);
            z-index: 1000;
        }

        .main-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            color: white;
            padding: 12px 18px;
            border-radius: 16px;
            outline: none;
            font-size: 16px;
            font-family: 'Outfit', sans-serif;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        #add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        #add-btn:hover {
            opacity: 0.85;
        }

        #add-btn:active {
            opacity: 0.7;
        }

        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .ai-suggest-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            flex: 1;
        }

        .chip {
            background: rgba(129, 140, 248, 0.1);
            border: 1px solid var(--primary);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .chip:hover {
            background: rgba(129, 140, 248, 0.25);
        }

        .cal-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text);
            opacity: 0.6;
            cursor: pointer;
            padding: 5px;
            transition: opacity 0.2s;
        }

        .cal-toggle-btn:hover {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            opacity: 0.3;
            margin-top: 50px;
            font-size: 1rem;
        }

        .toast {
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 999;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding-top: 10px;
            }

            .ai-banner {
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <nav>
            <div class="nav-logo">FocusFlow AI</div>
            <div class="nav-user">
                <div class="user-dot"></div>
                <span>Ankith Raj</span>
            </div>
        </nav>

        <div class="date-header">
            <div class="live-clock">
                <p id="current-day-name"></p>
                <h2 id="current-time">00:00</h2>
            </div>
        </div>

        <div class="ai-banner" id="ai-insight-box">
            <i data-lucide="sparkles" color="#818cf8"></i>
            <p id="ai-message">Analyzing your productivity patterns...</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span id="stat-total">0</span>
                <p>Total</p>
            </div>
            <div class="stat-card">
                <span id="stat-pending">0</span>
                <p>Pending</p>
            </div>
            <div class="stat-card">
                <span id="stat-done">0</span>
                <p>Done</p>
            </div>
        </div>

        <div class="timeline" id="timeline-bar"></div>

        <main>
            <ul id="task-list"></ul>
        </main>

        <div class="glass-input-box">
            <div class="calendar-wrapper" id="calendar-widget">
                <div class="calendar-header">
                    <button class="action-btn" id="prev-month">
                        <i data-lucide="chevron-left" size="18"></i>
                    </button>
                    <h3 id="month-display" style="font-size:0.9rem"></h3>
                    <button class="action-btn" id="next-month">
                        <i data-lucide="chevron-right" size="18"></i>
                    </button>
                </div>
                <div class="calendar-grid" id="calendar-days"></div>
            </div>

            <div class="main-input-area">
                <input type="text" id="task-input" placeholder="What's next? (Try #study)">
                <button id="add-btn">Add</button>
            </div>

            <div class="bottom-controls">
                <div class="ai-suggest-chips" id="suggest-chips">
                    <span class="chip" onclick="applySuggest('#work')">+ #work</span>
                    <span class="chip" onclick="applySuggest('#study')">+ #study</span>
                    <span class="chip" onclick="applySuggest('#personal')">+ #personal</span>
                </div>
                <button class="cal-toggle-btn" id="toggle-calendar-btn">
                    <i data-lucide="calendar" size="20"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        console.log("JS LOADED SUCCESSFULLY");

        // ─── State ───────────────────────────────────────────────────────────
        let tasks = [];

        // 🔧 UPDATE THIS with your actual Render backend URL
        const API_URL = "https://focus-flow-gdii.onrender.com";

        // Validate API_URL on page load
        if (!API_URL || API_URL === "https://focus-flow-gdii.onrender.com") {
            console.warn("⚠️ Using default API_URL. Update it with your actual Render backend URL in the code.");
        }

        let editingId = null;
        let isAddingTask = false;

        // FIX #1: Use local date string (YYYY-MM-DD) to avoid UTC timezone offset bug.
        function localDateStr(date = new Date()) {
            return date.toLocaleDateString('en-CA'); // 'en-CA' gives YYYY-MM-DD in local time
        }

        let selectedDate = localDateStr();
        let calendarNavDate = new Date();

        // ─── Toast Notification ───────────────────────────────────────────────
        function showToast(message, duration = 2000) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }

        // ─── Clock ───────────────────────────────────────────────────────────
        let clockInterval = null;
        function startClock() {
            if (clockInterval) clearInterval(clockInterval);
            function tick() {
                const now = new Date();
                document.getElementById('current-time').innerText =
                    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('current-day-name').innerText =
                    now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
            }
            tick();
            clockInterval = setInterval(tick, 1000);
        }

        // ─── AI Insights ─────────────────────────────────────────────────────
        function generateAIInsights() {
            const todayTasks = tasks.filter(t => t.assignedDate === selectedDate);
            const doneToday = todayTasks.filter(t => t.completed).length;
            const pending = todayTasks.filter(t => !t.completed).length;
            const insightPara = document.getElementById('ai-message');

            if (tasks.length === 0 || todayTasks.length === 0) {
                insightPara.innerText = tasks.length === 0
                    ? "Welcome, Ankith! Ready to deploy your first mission?"
                    : "Your schedule is clear. Use the time to plan ahead.";
                return;
            }
            if (doneToday > 0 && doneToday === todayTasks.length) {
                insightPara.innerText = `All ${doneToday} missions cleared for today. You're on fire! 🔥`;
            } else if (doneToday > 2) {
                insightPara.innerText = `You completed ${doneToday} tasks today. Keep that momentum! 🚀`;
            } else {
                insightPara.innerText = pending > 0
                    ? `You have ${pending} mission${pending > 1 ? 's' : ''} active for today. Focus up!`
                    : "Your schedule is clear. Use the time to plan ahead.";
            }
        }

        // ─── Fetch Tasks ──────────────────────────────────────────────────────
        let lastFetchedDate = null;
        async function fetchTasks(force = false) {
            // Only fetch if date changed or forced
            if (!force && selectedDate === lastFetchedDate) {
                renderTasks();
                return;
            }
            lastFetchedDate = selectedDate;
            try {
                const res = await fetch(`${API_URL}/tasks?date=${selectedDate}`);
                if (!res.ok) throw new Error(`API error: ${res.status}`);
                let data = await res.json();
                if (!Array.isArray(data)) {
                    console.error("API did not return an array:", data);
                    data = [];
                }
                tasks = data;
                renderTasks();
            } catch (err) {
                console.error("Fetch error:", err);
                // Try localStorage fallback
                const saved = localStorage.getItem('ankith_focus_ai_v1');
                if (saved) {
                    try {
                        tasks = JSON.parse(saved);
                        if (!Array.isArray(tasks)) tasks = [];
                        renderTasks();
                    } catch (e) {
                        console.error("LocalStorage parse error:", e);
                    }
                }
            }
        }

        // ─── Render Tasks ─────────────────────────────────────────────────────
        function renderTasks() {
            const list = document.getElementById('task-list');
            const filtered = tasks
                .filter(t => t.assignedDate === selectedDate)
                .sort((a, b) => {
                    if (a.pinned !== b.pinned) return b.pinned - a.pinned;
                    return a.completed - b.completed;
                });

            if (!filtered.length) {
                list.innerHTML = '<p class="empty-state">No missions found.</p>';
                updateStats();
                generateAIInsights();
                return;
            }

            list.innerHTML = '';
            filtered.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-card ${task.completed ? 'completed' : ''} ${task.pinned ? 'is-pinned' : ''}`;
                li.dataset.id = task.id;

                const displayText = task.text.replace(/#(\w+)/g, '<span class="tag">#$1</span>');

                li.innerHTML = `
                    <div class="check-circle ${task.completed ? 'checked' : ''}" onclick="toggleTask('${task.id}')">
                        ${task.completed ? '<i data-lucide="check" size="16" color="white"></i>' : ''}
                    </div>
                    <div class="task-content">
                        ${editingId === task.id
                        ? `<input class="task-edit-input" id="edit-input-${task.id}" value="${escapeAttr(task.text)}" />`
                        : `<span class="task-text" ondblclick="startEdit('${task.id}')">${displayText}</span>`
                    }
                    </div>
                    <div class="actions">
                        ${editingId === task.id
                        ? `<button class="action-btn edit-btn active" onclick="saveEdit('${task.id}')"><i data-lucide="check" size="16"></i></button>
                               <button class="action-btn" onclick="cancelEdit()"><i data-lucide="x" size="16"></i></button>`
                        : `<button class="action-btn pin-btn ${task.pinned ? 'active' : ''}" onclick="togglePin('${task.id}')">
                                   <i data-lucide="pin" size="16"></i>
                               </button>
                               <button class="action-btn" onclick="deleteTask('${task.id}')">
                                   <i data-lucide="trash-2" size="16"></i>
                               </button>`
                    }
                    </div>
                `;
                list.appendChild(li);
            });

            updateStats();
            generateAIInsights();
            lucide.createIcons();

            // Focus edit input if in edit mode
            if (editingId) {
                const inp = document.getElementById(`edit-input-${editingId}`);
                if (inp) {
                    inp.focus();
                    inp.selectionStart = inp.selectionEnd = inp.value.length;
                    inp.addEventListener('keydown', e => {
                        if (e.key === 'Enter') saveEdit(editingId);
                        if (e.key === 'Escape') cancelEdit();
                    });
                }
            }
        }

        function escapeAttr(str) {
            return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // FIX #5: Stats now count only today's tasks
        function updateStats() {
            const todayTasks = tasks.filter(t => t.assignedDate === selectedDate);
            document.getElementById('stat-total').innerText = todayTasks.length;
            document.getElementById('stat-pending').innerText = todayTasks.filter(t => !t.completed).length;
            document.getElementById('stat-done').innerText = todayTasks.filter(t => t.completed).length;
        }

        // ─── Timeline ─────────────────────────────────────────────────────────
        function setupTimeline() {
            const bar = document.getElementById('timeline-bar');
            bar.innerHTML = '';
            for (let i = -1; i <= 3; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dStr = localDateStr(d);
                const tab = document.createElement('div');
                tab.className = `day-tab ${dStr === selectedDate ? 'active' : ''}`;
                tab.innerHTML = `<span>${i === 0 ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short' })}</span><strong>${d.getDate()}</strong>`;
                tab.onclick = () => {
                    selectedDate = dStr;
                    editingId = null;
                    setupTimeline();
                    renderCalendar();
                    fetchTasks(true); // Always fetch tasks when date changes
                };
                bar.appendChild(tab);
            }
        }

        // ─── Calendar ─────────────────────────────────────────────────────────
        function renderCalendar() {
            const monthDisplay = document.getElementById('month-display');
            const daysGrid = document.getElementById('calendar-days');
            monthDisplay.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(calendarNavDate);
            daysGrid.innerHTML = '';

            ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach(d => {
                const h = document.createElement('div');
                h.style.cssText = 'font-size:10px;opacity:0.5;text-align:center;padding:4px 0';
                h.innerText = d;
                daysGrid.appendChild(h);
            });

            const firstDay = new Date(calendarNavDate.getFullYear(), calendarNavDate.getMonth(), 1).getDay();
            const daysInMonth = new Date(calendarNavDate.getFullYear(), calendarNavDate.getMonth() + 1, 0).getDate();
            const todayStr = localDateStr();

            for (let i = 0; i < firstDay; i++) daysGrid.appendChild(document.createElement('div'));

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = localDateStr(new Date(calendarNavDate.getFullYear(), calendarNavDate.getMonth(), day));
                const d = document.createElement('div');
                const isActive = dateStr === selectedDate;
                const isToday = dateStr === todayStr;
                d.className = `cal-date${isActive ? ' active' : ''}${isToday ? ' today' : ''}`;
                d.innerText = day;
                d.onclick = () => {
                    selectedDate = dateStr;
                    editingId = null;
                    setupTimeline();
                    renderCalendar();
                    fetchTasks(true); // Always fetch tasks when date changes
                };
                daysGrid.appendChild(d);
            }
        }

        // ─── ADD TASK (FIXED) ──────────────────────────────────────────────────
        async function addTask() {
            const input = document.getElementById('task-input');
            const val = input.value.trim();

            if (!val) {
                showToast("⚠️ Please enter a task!");
                return;
            }

            if (isAddingTask) {
                showToast("⏳ Task is being added...");
                return;
            }

            isAddingTask = true;
            document.getElementById('add-btn').disabled = true;
            document.getElementById('add-btn').textContent = 'Adding...';

            try {
                const response = await fetch(`${API_URL}/tasks`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text: val,
                        assignedDate: selectedDate
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                input.value = '';
                showToast("✅ Task added!");
                await fetchTasks();
            } catch (err) {
                console.error("Add task error:", err);
                showToast("❌ Failed to add task. Check your connection.");

                // Fallback: save to localStorage
                try {
                    const newTask = {
                        id: Date.now().toString(),
                        text: val,
                        assignedDate: selectedDate,
                        completed: false,
                        pinned: false
                    };
                    tasks.push(newTask);
                    localStorage.setItem('ankith_focus_ai_v1', JSON.stringify(tasks));
                    input.value = '';
                    renderTasks();
                    showToast("💾 Saved locally (sync pending)");
                } catch (e) {
                    console.error("LocalStorage save error:", e);
                }
            } finally {
                isAddingTask = false;
                document.getElementById('add-btn').disabled = false;
                document.getElementById('add-btn').textContent = 'Add';
            }
        }

        function applySuggest(tag) {
            const input = document.getElementById('task-input');
            input.value = tag + ' ';
            input.focus();
        }

        // ─── Task Actions ─────────────────────────────────────────────────────
        window.startEdit = (id) => {
            editingId = id;
            renderTasks();
        };

        window.saveEdit = async (id) => {
            const inp = document.getElementById(`edit-input-${id}`);
            if (!inp) return;

            const val = inp.value.trim();
            if (!val) return;

            try {
                const response = await fetch(`${API_URL}/tasks/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: val })
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);

                editingId = null;
                showToast("✅ Task updated!");
                fetchTasks();
            } catch (err) {
                console.error("Save edit error:", err);
                showToast("❌ Failed to update task");
            }
        };

        window.cancelEdit = () => {
            editingId = null;
            renderTasks();
        };

        window.toggleTask = async (id) => {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            try {
                const response = await fetch(`${API_URL}/tasks/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ completed: !task.completed })
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);
                fetchTasks();
            } catch (err) {
                console.error("Toggle task error:", err);
                showToast("❌ Failed to update task");
            }
        };

        window.togglePin = async (id) => {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            try {
                const response = await fetch(`${API_URL}/tasks/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ pinned: !task.pinned })
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);
                fetchTasks();
            } catch (err) {
                console.error("Toggle pin error:", err);
                showToast("❌ Failed to pin task");
            }
        };

        window.deleteTask = async (id) => {
            if (!confirm('Delete mission?')) return;

            try {
                const response = await fetch(`${API_URL}/tasks/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);
                fetchTasks();
                showToast("🗑️ Task deleted!");
            } catch (err) {
                console.error("Delete task error:", err);
                showToast("❌ Failed to delete task");
            }
        };

        // ─── Sortable ─────────────────────────────────────────────────────────
        new Sortable(document.getElementById('task-list'), {
            animation: 150,
            handle: '.task-content',
            filter: '.task-edit-input',
            onEnd: function () {
                const list = document.getElementById('task-list');
                const newIds = Array.from(list.querySelectorAll('.task-card')).map(li => li.dataset.id);
                const currentDayTasks = tasks.filter(t => t.assignedDate === selectedDate);
                const otherDayTasks = tasks.filter(t => t.assignedDate !== selectedDate);

                const reorderedDayTasks = newIds
                    .map(id => currentDayTasks.find(t => t.id === id))
                    .filter(Boolean);

                tasks = [...reorderedDayTasks, ...otherDayTasks];
                localStorage.setItem('ankith_focus_ai_v1', JSON.stringify(tasks));
                lucide.createIcons();
            }
        });

        // ─── UI Controls ──────────────────────────────────────────────────────
        document.getElementById('prev-month').onclick = () => {
            calendarNavDate.setMonth(calendarNavDate.getMonth() - 1);
            renderCalendar();
        };

        document.getElementById('next-month').onclick = () => {
            calendarNavDate.setMonth(calendarNavDate.getMonth() + 1);
            renderCalendar();
        };

        document.getElementById('toggle-calendar-btn').onclick = () => {
            const widget = document.getElementById('calendar-widget');
            const isOpen = widget.style.display === 'block';
            widget.style.display = isOpen ? 'none' : 'block';
            if (!isOpen) renderCalendar();
        };

        // ✅ FIXED: Single, correct event listener
        document.getElementById('add-btn').onclick = addTask;

        document.getElementById('task-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') addTask();
        });

        // ─── Init ─────────────────────────────────────────────────────────────
        startClock();
        setupTimeline();
        renderCalendar();
        fetchTasks(true);
    </script>
</body>

</html>
