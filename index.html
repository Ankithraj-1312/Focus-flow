<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>FocusFlow AI | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --primary: #818cf8;
            --secondary: #c084fc;
            --accent: #22d3ee;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --danger: #f43f5e;
            --success: #22c55e;
            --pin: #fbbf24;
            --ai-glow: rgba(129, 140, 248, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(129, 140, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(192, 132, 252, 0.15) 0px, transparent 50%);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px));
        }

        .app-container {
            width: 100%;
            max-width: 650px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 1rem;
        }

        .nav-logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .user-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .date-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .live-clock h2 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1;
        }

        .live-clock p {
            opacity: 0.6;
            font-size: 0.9rem;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ai-banner {
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.2), rgba(192, 132, 252, 0.2));
            border: 1px solid var(--primary);
            padding: 15px 20px;
            border-radius: 20px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            animation: pulse 4s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0px var(--ai-glow);
            }

            50% {
                box-shadow: 0 0 20px var(--ai-glow);
            }

            100% {
                box-shadow: 0 0 0px var(--ai-glow);
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card span {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text);
        }

        .timeline-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .timeline {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            flex: 1;
        }

        .day-tab {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 20px;
            min-width: 100px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .day-tab span {
            display: block;
            font-size: 0.7rem;
            opacity: 0.5;
            text-transform: uppercase;
            font-weight: 700;
        }

        .day-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 10px 15px -5px rgba(129, 140, 248, 0.4);
        }

        #task-list {
            list-style: none;
            margin-top: 1rem;
        }

        .task-card {
            background: var(--card-bg);
            padding: 1.2rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            transition: 0.3s;
            position: relative;
        }

        .task-card.is-pinned {
            border-color: var(--pin);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }

        .task-card.completed {
            opacity: 0.5;
        }

        .task-card.completed .task-text {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .check-circle {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .check-circle.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .task-content {
            flex: 1;
            margin: 0 15px;
        }

        .task-text {
            display: block;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .tag {
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 5px;
        }

        .actions {
            display: flex;
            gap: 4px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: #64748b;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: var(--text);
        }

        .glass-input-box {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 610px;
            background: rgba(15, 23, 42, 0.97);
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom, 0px));
            border-radius: 24px 24px 0 0;
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            z-index: 1000;
        }

        .main-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            color: white;
            padding: 12px 18px;
            border-radius: 16px;
            outline: none;
            font-size: 16px;
        }

        #add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
        }

        .toast {
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 999;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .calendar-wrapper {
            margin-bottom: 10px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 20px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <nav>
            <div class="nav-logo">FocusFlow AI</div>
            <div class="nav-user">
                <div class="user-dot"></div>
                <span>Ankith Raj</span>
            </div>
        </nav>

        <div class="date-header">
            <div class="live-clock">
                <p id="current-day-name"></p>
                <h2 id="current-time">00:00</h2>
            </div>
        </div>

        <div class="ai-banner" id="ai-insight-box">
            <i data-lucide="sparkles" color="#818cf8"></i>
            <p id="ai-message">Analyzing your productivity patterns...</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span id="stat-total">0</span>
                <p>Total</p>
            </div>
            <div class="stat-card">
                <span id="stat-pending">0</span>
                <p>Pending</p>
            </div>
            <div class="stat-card">
                <span id="stat-done">0</span>
                <p>Done</p>
            </div>
        </div>

        <!-- Timeline with Arrows -->
        <div class="timeline-container">
            <button class="action-btn" onclick="shiftTimeline(-1)">
                <i data-lucide="chevron-left"></i>
            </button>
            <div class="timeline" id="timeline-bar"></div>
            <button class="action-btn" onclick="shiftTimeline(1)">
                <i data-lucide="chevron-right"></i>
            </button>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:10px;">
            <div style="display:flex;gap:8px;">
                <button id="filter-all"
                    style="background:var(--primary);color:white;border:none;padding:6px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;">All</button>
                <button id="filter-pending"
                    style="background:transparent;color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;">Pending</button>
                <button id="filter-completed"
                    style="background:transparent;color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;">Completed</button>
            </div>
            <button id="copy-yesterday-to-today"
                style="background:var(--secondary);color:white;border:none;padding:6px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;white-space:nowrap;">📋
                Copy Yesterday</button>
        </div>

        <main>
            <ul id="task-list"></ul>
        </main>

        <div class="glass-input-box">
            <div class="calendar-wrapper" id="calendar-widget">
                <div style="display:flex; justify-content: space-between; align-items:center;">
                    <button class="action-btn" id="prev-month"><i data-lucide="chevron-left" size="18"></i></button>
                    <h3 id="month-display" style="font-size:0.9rem"></h3>
                    <button class="action-btn" id="next-month"><i data-lucide="chevron-right" size="18"></i></button>
                </div>
                <div id="calendar-days"
                    style="display:grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align:center; margin-top:10px;">
                </div>
            </div>

            <div class="main-input-area">
                <input type="text" id="task-input" placeholder="What's next?">
                <button id="add-btn">Add</button>
            </div>

            <div class="bottom-controls" style="display:flex; justify-content: space-between; align-items:center;">
                <div class="ai-suggest-chips" id="suggest-chips" style="display:flex; gap:8px;">
                    <span class="chip" onclick="applySuggest('#work')"
                        style="background:rgba(129,140,248,0.1); border:1px solid var(--primary); padding:5px 10px; border-radius:10px; font-size:0.7rem; cursor:pointer;">+
                        #work</span>
                    <span class="chip" onclick="applySuggest('#study')"
                        style="background:rgba(129,140,248,0.1); border:1px solid var(--primary); padding:5px 10px; border-radius:10px; font-size:0.7rem; cursor:pointer;">+
                        #study</span>
                </div>
                <button class="cal-toggle-btn" id="toggle-calendar-btn"
                    style="background:none; border:none; color:white; cursor:pointer;">
                    <i data-lucide="calendar" size="20"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let tasks = [];
        const API_URL = "https://focus-flow-gdii.onrender.com";
        let selectedDate = new Date().toLocaleDateString('en-CA');
        let timelineOffset = 0;
        let filterMode = 'all';

        function startClock() {
            const tick = () => {
                const now = new Date();
                document.getElementById('current-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('current-day-name').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
            };
            tick();
            setInterval(tick, 1000);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function shiftTimeline(dir) {
            timelineOffset += dir;
            setupTimeline();
        }

        function setupTimeline() {
            const bar = document.getElementById('timeline-bar');
            bar.innerHTML = '';
            for (let i = -1 + timelineOffset; i <= 3 + timelineOffset; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dStr = d.toLocaleDateString('en-CA');
                const tab = document.createElement('div');
                tab.className = `day-tab ${dStr === selectedDate ? 'active' : ''}`;
                tab.innerHTML = `<span>${i - timelineOffset === 0 ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short' })}</span><strong>${d.getDate()}</strong>`;
                tab.onclick = () => {
                    selectedDate = dStr;
                    setupTimeline();
                    fetchTasks();
                };
                bar.appendChild(tab);
            }
        }

        async function fetchTasks() {
            try {
                const res = await fetch(`${API_URL}/tasks?date=${selectedDate}`);
                tasks = await res.json();
                renderTasks();
            } catch (err) { console.error(err); }
        }

        window.toggleTask = async (id) => {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            task.completed = !task.completed;
            renderTasks();
            try {
                await fetch(`${API_URL}/tasks/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ completed: task.completed })
                });
            } catch (err) {
                task.completed = !task.completed;
                renderTasks();
                showToast("Sync Error!");
            }
        };

        function renderTasks() {
            const list = document.getElementById('task-list');
            let filtered = tasks.filter(t => t.assignedDate === selectedDate)
                .sort((a, b) => b.pinned - a.pinned || a.completed - b.completed);

            if (filterMode === 'pending') filtered = filtered.filter(t => !t.completed);
            if (filterMode === 'completed') filtered = filtered.filter(t => t.completed);

            list.innerHTML = filtered.length ? '' : '<p style="text-align:center; opacity:0.3; margin-top:50px;">No missions found.</p>';

            filtered.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-card ${task.completed ? 'completed' : ''} ${task.pinned ? 'is-pinned' : ''}`;
                li.innerHTML = `
                    <div class="check-circle ${task.completed ? 'checked' : ''}" onclick="toggleTask('${task.id}')">
                        ${task.completed ? '<i data-lucide="check" size="16"></i>' : ''}
                    </div>
                    <div class="task-content">
                        <span class="task-text">${task.text.replace(/#(\w+)/g, '<span class="tag">#$1</span>')}</span>
                    </div>
                    <div class="actions">
                        <button class="action-btn" onclick="deleteTask('${task.id}')"><i data-lucide="trash-2" size="16"></i></button>
                    </div>
                `;
                list.appendChild(li);
            });
            updateStats();
            lucide.createIcons();
        }

        function updateStats() {
            const current = tasks.filter(t => t.assignedDate === selectedDate);
            document.getElementById('stat-total').innerText = current.length;
            document.getElementById('stat-pending').innerText = current.filter(t => !t.completed).length;
            document.getElementById('stat-done').innerText = current.filter(t => t.completed).length;
        }

        async function addTask() {
            const inp = document.getElementById('task-input');
            if (!inp.value.trim()) return;
            const res = await fetch(`${API_URL}/tasks`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: inp.value, assignedDate: selectedDate })
            });
            if (res.ok) { inp.value = ''; fetchTasks(); }
        }

        window.deleteTask = async (id) => {
            if (confirm('Delete?')) {
                await fetch(`${API_URL}/tasks/${id}`, { method: "DELETE" });
                fetchTasks();
            }
        };

        // --- Restored Copy Yesterday Logic ---
        document.getElementById('copy-yesterday-to-today').onclick = async function () {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yestStr = yesterday.toLocaleDateString('en-CA');
            const todayStr = new Date().toLocaleDateString('en-CA');

            try {
                const res = await fetch(`${API_URL}/tasks?date=${yestStr}`);
                const prevTasks = await res.json();

                const pending = prevTasks.filter(t => !t.completed);
                if (pending.length === 0) {
                    showToast("No pending tasks to copy!");
                    return;
                }

                for (const t of pending) {
                    await fetch(`${API_URL}/tasks`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ text: t.text, assignedDate: todayStr, pinned: t.pinned })
                    });
                }

                selectedDate = todayStr;
                timelineOffset = 0;
                setupTimeline();
                fetchTasks();
                showToast(`Copied ${pending.length} tasks!`);
            } catch (err) {
                showToast("Failed to copy tasks.");
            }
        };

        function applySuggest(tag) {
            const inp = document.getElementById('task-input');
            inp.value = tag + " ";
            inp.focus();
        }

        document.getElementById('filter-all').onclick = () => { filterMode = 'all'; renderTasks(); };
        document.getElementById('filter-pending').onclick = () => { filterMode = 'pending'; renderTasks(); };
        document.getElementById('filter-completed').onclick = () => { filterMode = 'completed'; renderTasks(); };
        document.getElementById('add-btn').onclick = addTask;
        document.getElementById('task-input').onkeydown = e => e.key === 'Enter' && addTask();

        startClock();
        setupTimeline();
        fetchTasks();
    </script>
</body>

</html>
