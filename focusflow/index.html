<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>FocusFlow AI | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --primary: #818cf8;
            --secondary: #c084fc;
            --accent: #22d3ee;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --danger: #f43f5e;
            --success: #22c55e;
            --pin: #fbbf24;
            --ai-glow: rgba(129, 140, 248, 0.2);
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(129, 140, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(192, 132, 252, 0.15) 0px, transparent 50%);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: calc(200px + env(safe-area-inset-bottom, 0px));
        }

        .app-container {
            width: 100%;
            max-width: 650px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 1rem;
        }

        .nav-logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .user-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .date-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .live-clock h2 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1;
        }

        .live-clock p {
            opacity: 0.6;
            font-size: 0.9rem;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ai-banner {
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.2), rgba(192, 132, 252, 0.2));
            border: 1px solid var(--primary);
            padding: 15px 20px;
            border-radius: 20px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            animation: pulse 4s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0px var(--ai-glow);
            }

            50% {
                box-shadow: 0 0 20px var(--ai-glow);
            }

            100% {
                box-shadow: 0 0 0px var(--ai-glow);
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card span {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text);
        }

        .timeline-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .timeline {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            flex: 1;
        }

        .day-tab {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 20px;
            min-width: 100px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .day-tab span {
            display: block;
            font-size: 0.7rem;
            opacity: 0.5;
            text-transform: uppercase;
            font-weight: 700;
        }

        .day-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 10px 15px -5px rgba(129, 140, 248, 0.4);
        }

        #task-list {
            list-style: none;
            margin-top: 1rem;
        }

        .task-card {
            background: var(--card-bg);
            padding: 1.2rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            transition: 0.3s;
            position: relative;
        }

        .task-card.completed {
            opacity: 0.5;
        }

        .task-card.completed .task-text {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .check-circle {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .check-circle.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .task-content {
            flex: 1;
            margin: 0 15px;
        }

        .task-text {
            display: block;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .tag {
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 5px;
        }

        .actions {
            display: flex;
            gap: 4px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: #64748b;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: var(--text);
        }

        .glass-input-box {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 610px;
            background: #1e293b;
            padding: 20px;
            border-radius: 24px 24px 0 0;
            border: 1px solid var(--border);
            z-index: 9999;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        .main-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
            width: 100%;
            align-items: stretch;
        }

        #task-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            padding: 14px 18px;
            border-radius: 16px;
            outline: none;
            font-size: 16px;
            pointer-events: auto;
            -webkit-appearance: none;
            appearance: none;
            font-family: 'Outfit', sans-serif;
        }

        #task-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #task-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        #add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            pointer-events: auto;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        #add-btn:hover {
            background: #6366f1;
            transform: scale(1.05);
        }

        #add-btn:active {
            transform: scale(0.98);
        }

        .toast {
            position: fixed;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 10000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .calendar-wrapper {
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 20px;
            display: none;
            border: 1px solid var(--border);
            max-height: 300px;
            overflow-y: auto;
        }

        .cal-day-cell {
            padding: 8px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .cal-day-cell:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .cal-day-cell.selected {
            background: var(--primary);
            color: white;
            font-weight: 700;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10001;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 24px;
        }

        .report-header {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .report-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .report-stat-item {
            background: rgba(129, 140, 248, 0.1);
            border: 1px solid var(--primary);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .report-stat-item strong {
            font-size: 1.8rem;
            display: block;
            color: var(--primary);
        }

        .report-stat-item small {
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .report-insights {
            background: rgba(192, 132, 252, 0.1);
            border: 1px solid var(--secondary);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .report-insights h4 {
            margin-bottom: 10px;
            color: var(--secondary);
        }

        .report-insights p {
            font-size: 0.95rem;
            line-height: 1.5;
            opacity: 0.9;
        }

        .task-breakdown {
            margin-top: 20px;
        }

        .task-breakdown h4 {
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .breakdown-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 0 10px;
            overflow: hidden;
        }

        .breakdown-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s;
        }

        .report-button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .report-button:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }

        .report-button.secondary {
            background: var(--secondary);
        }

        .report-button.secondary:hover {
            background: #b565f5;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid var(--danger);
            color: #fca5ac;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: #86efac;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* Loading Overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 20000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(129, 140, 248, 0.1);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loader-text {
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        .sortable-ghost {
            opacity: 0.4;
            background: var(--primary);
        }
    </style>
</head>

<body>
    <div id="loading-overlay">
        <div class="loader-spinner"></div>
        <div class="loader-text">WAKING UP AI...</div>
    </div>

    <div class="app-container">
        <nav>
            <div class="nav-logo">FocusFlow AI</div>
            <div class="nav-user">
                <div class="user-dot"></div>
                <span>Ankith Raj</span>
            </div>
        </nav>

        <div class="date-header">
            <div class="live-clock">
                <p id="current-day-name"></p>
                <h2 id="current-time">00:00</h2>
            </div>
        </div>

        <div class="ai-banner" id="ai-insight-box">
            <i data-lucide="sparkles" color="#818cf8"></i>
            <p id="ai-message">✨ AI insights ready to help you stay focused</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span id="stat-total">0</span>
                <p>Total</p>
            </div>
            <div class="stat-card">
                <span id="stat-pending">0</span>
                <p>Pending</p>
            </div>
            <div class="stat-card">
                <span id="stat-done">0</span>
                <p>Done</p>
            </div>
        </div>

        <div class="timeline-container">
            <button class="action-btn" onclick="shiftTimeline(-1)">
                <i data-lucide="chevron-left"></i>
            </button>
            <div class="timeline" id="timeline-bar"></div>
            <button class="action-btn" onclick="shiftTimeline(1)">
                <i data-lucide="chevron-right"></i>
            </button>
        </div>

        <div
            style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:10px;flex-wrap:wrap;">
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button id="filter-all"
                    style="background:var(--primary);color:white;border:none;padding:6px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;">All</button>
                <button id="filter-pending"
                    style="background:transparent;color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;">Pending</button>
                <button id="filter-completed"
                    style="background:transparent;color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;">Completed</button>
            </div>
            <button id="copy-yesterday-to-today"
                style="background:var(--secondary);color:white;border:none;padding:6px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;white-space:nowrap;">📋
                Copy Yesterday</button>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;">
            <button id="report-week-btn"
                style="background:var(--accent);color:#0f172a;border:none;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;">📊
                Week Report</button>
            <button id="report-month-btn"
                style="background:var(--accent);color:#0f172a;border:none;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;">📈
                Month Report</button>
            <button id="report-year-btn"
                style="background:var(--accent);color:#0f172a;border:none;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:0.85rem;">📉
                Year Report</button>
        </div>

        <main>
            <ul id="task-list"></ul>
        </main>

        <div class="glass-input-box">
            <div class="calendar-wrapper" id="calendar-widget">
                <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:10px;">
                    <button class="action-btn" onclick="changeMonth(-1)" style="padding: 4px;"><i
                            data-lucide="chevron-left" size="18"></i></button>
                    <h3 id="month-display" style="font-size:0.9rem; flex:1; text-align:center;"></h3>
                    <button class="action-btn" onclick="changeMonth(1)" style="padding: 4px;"><i
                            data-lucide="chevron-right" size="18"></i></button>
                </div>
                <div id="calendar-days"
                    style="display:grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align:center;"></div>
            </div>

            <div class="main-input-area">
                <input type="text" id="task-input" placeholder="What's next?" autocomplete="off" spellcheck="false">
                <button id="add-btn">Add</button>
            </div>

            <div class="bottom-controls" style="display:flex; justify-content: space-between; align-items:center;">
                <div class="ai-suggest-chips" style="display:flex; gap:8px;">
                    <span class="chip" onclick="applySuggest('#work')"
                        style="background:rgba(129,140,248,0.1); border:1px solid var(--primary); padding:5px 10px; border-radius:10px; font-size:0.7rem; cursor:pointer;">+
                        #work</span>
                    <span class="chip" onclick="applySuggest('#study')"
                        style="background:rgba(129,140,248,0.1); border:1px solid var(--primary); padding:5px 10px; border-radius:10px; font-size:0.7rem; cursor:pointer;">+
                        #study</span>
                </div>
                <button id="toggle-calendar-btn"
                    style="background:none; border:none; color:white; cursor:pointer; padding:8px;">
                    <i data-lucide="calendar" size="20"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Report Modal -->
    <div class="modal-overlay" id="report-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeReportModal()">✕</button>
            <div id="report-body"></div>
        </div>
    </div>

    <script>
        let tasks = [];
        let API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
            ? "http://127.0.0.1:5000"
            : "https://focus-flow-gdii.onrender.com";
        let retryCount = 0;

        function formatDate(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        let selectedDate = formatDate(new Date());
        let calDate = new Date();
        let timelineOffset = 0;
        let filterMode = 'all';
        let isFirstLoad = true;

        // ==================== UTILITY FUNCTIONS ====================
        async function warmUpBackend() {
            try {
                const res = await fetch(`${API_URL}/`).catch(() => null);
                if (!res && API_URL === "http://127.0.0.1:5000") {
                    console.log("Local backend offline, switching to cloud backend...");
                    API_URL = "https://focus-flow-gdii.onrender.com";
                    warmUpBackend();
                }
            } catch (e) {}
        }

        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.visibility = 'hidden', 500);
            }
        }
        function startClock() {
            const tick = () => {
                const now = new Date();
                document.getElementById('current-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('current-day-name').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
            };
            tick();
            setInterval(tick, 1000);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function getDateRange(type) {
            const today = new Date(selectedDate);
            let startDate, endDate;

            if (type === 'week') {
                startDate = new Date(today);
                startDate.setDate(today.getDate() - today.getDay());
                endDate = new Date(startDate);
                endDate.setDate(startDate.getDate() + 6);
            } else if (type === 'month') {
                startDate = new Date(today.getFullYear(), today.getMonth(), 1);
                endDate = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            } else if (type === 'year') {
                startDate = new Date(today.getFullYear(), 0, 1);
                endDate = new Date(today.getFullYear(), 11, 31);
            }

            return {
                start: formatDate(startDate),
                end: formatDate(endDate),
                startDate,
                endDate
            };
        }

        async function fetchTasksForDateRange(startDate, endDate) {
            try {
                const res = await fetch(`${API_URL}/tasks`);
                const allTasks = await res.json();
                return allTasks.filter(t => {
                    const taskDate = new Date(t.assignedDate);
                    return taskDate >= startDate && taskDate <= endDate;
                });
            } catch (err) {
                console.error(err);
                return [];
            }
        }

        function generateAIInsights(reportTasks) {
            const completed = reportTasks.filter(t => t.completed).length;
            const total = reportTasks.length;
            const completionRate = total ? Math.round((completed / total) * 100) : 0;
            const avgDaily = total > 0 ? Math.round(total / 7) : 0;

            let insights = [];

            if (completionRate >= 80) {
                insights.push("🎯 Excellent productivity! You're crushing your goals!");
            } else if (completionRate >= 60) {
                insights.push("💪 Good progress! Keep the momentum going.");
            } else if (completionRate >= 40) {
                insights.push("📍 Moderate performance. Time to focus on priorities.");
            } else {
                insights.push("⚠️ Low completion rate. Break tasks into smaller chunks.");
            }

            if (avgDaily > 10) {
                insights.push("📌 You're taking on a lot. Consider if all tasks are essential.");
            } else if (avgDaily < 3) {
                insights.push("💡 You have capacity. Push yourself to add more meaningful goals.");
            }

            const workTasks = reportTasks.filter(t => t.text.includes('#work')).length;
            const studyTasks = reportTasks.filter(t => t.text.includes('#study')).length;

            if (workTasks > 0) {
                insights.push(`💼 Work tasks: ${workTasks} (${Math.round((workTasks / total) * 100)}%)`);
            }
            if (studyTasks > 0) {
                insights.push(`📚 Study tasks: ${studyTasks} (${Math.round((studyTasks / total) * 100)}%)`);
            }

            return insights;
        }

        async function generateReport(type) {
            const range = getDateRange(type);
            const reportTasks = await fetchTasksForDateRange(range.startDate, range.endDate);

            const completed = reportTasks.filter(t => t.completed).length;
            const pending = reportTasks.filter(t => !t.completed).length;
            const total = reportTasks.length;
            const completionRate = total ? Math.round((completed / total) * 100) : 0;

            const insights = generateAIInsights(reportTasks);

            let reportHTML = `
                <div class="report-header">
                    <i data-lucide="zap"></i>
                    ${type.charAt(0).toUpperCase() + type.slice(1)} Report
                </div>
                <p style="opacity: 0.7; margin-bottom: 15px; font-size: 0.9rem;">
                    ${range.start} to ${range.end}
                </p>

                <div class="report-stats">
                    <div class="report-stat-item">
                        <strong>${total}</strong>
                        <small>Total Tasks</small>
                    </div>
                    <div class="report-stat-item">
                        <strong>${completionRate}%</strong>
                        <small>Completion Rate</small>
                    </div>
                    <div class="report-stat-item">
                        <strong>${completed}</strong>
                        <small>Completed</small>
                    </div>
                    <div class="report-stat-item">
                        <strong>${pending}</strong>
                        <small>Pending</small>
                    </div>
                </div>

                <div class="report-insights">
                    <h4>✨ AI Insights</h4>
                    <div style="font-size: 0.95rem;">
                        ${insights.map(i => `<p style="margin-bottom: 8px;">• ${i}</p>`).join('')}
                    </div>
                </div>

                <div class="task-breakdown">
                    <h4>Task Distribution</h4>
                    <div class="breakdown-item">
                        <span>Completed</span>
                        <div class="breakdown-bar">
                            <div class="breakdown-bar-fill" style="width: ${completionRate}%; background: var(--success);"></div>
                        </div>
                        <span style="min-width: 40px; text-align: right;">${completed}</span>
                    </div>
                    <div class="breakdown-item">
                        <span>Pending</span>
                        <div class="breakdown-bar">
                            <div class="breakdown-bar-fill" style="width: ${Math.round((pending / total) * 100)}%; background: var(--warning);"></div>
                        </div>
                        <span style="min-width: 40px; text-align: right;">${pending}</span>
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <button class="report-button" onclick="downloadReport('${type}', ${JSON.stringify({ total, completed, pending, completionRate, range })})">
                        <i data-lucide="download" style="display: inline; margin-right: 5px;"></i> Download Report
                    </button>
                </div>
            `;

            document.getElementById('report-body').innerHTML = reportHTML;
            document.getElementById('report-modal').classList.add('active');
            lucide.createIcons();
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.remove('active');
        }

        function downloadReport(type, data) {
            const content = `
FocusFlow AI - ${type.toUpperCase()} REPORT
Generated: ${new Date().toLocaleString()}
Period: ${data.range.start} to ${data.range.end}

SUMMARY
-------
Total Tasks: ${data.total}
Completed: ${data.completed}
Pending: ${data.pending}
Completion Rate: ${data.completionRate}%

This report was generated by FocusFlow AI based on your task data.
Use these insights to improve your productivity and task management.
            `;

            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(content));
            element.setAttribute('download', `FocusFlow_${type}_Report_${new Date().getTime()}.txt`);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);

            showToast(`${type} report downloaded!`);
        }

        // ==================== TIMELINE & TASK FUNCTIONS ====================
        function shiftTimeline(dir) {
            timelineOffset += dir;
            setupTimeline();
        }

        function setupTimeline() {
            const bar = document.getElementById('timeline-bar');
            bar.innerHTML = '';
            const todayStr = formatDate(new Date());
            for (let i = -1 + timelineOffset; i <= 3 + timelineOffset; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dStr = formatDate(d);
                const tab = document.createElement('div');
                tab.className = `day-tab ${dStr === selectedDate ? 'active' : ''}`;
                tab.innerHTML = `<span>${dStr === todayStr ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short' })}</span><strong>${d.getDate()}</strong>`;
                tab.onclick = () => {
                    selectedDate = dStr;
                    setupTimeline();
                    fetchTasks();
                };
                bar.appendChild(tab);
            }
        }

        async function fetchTasks() {
            if (isFirstLoad) {
                setTimeout(() => {
                    if (isFirstLoad) {
                        hideLoading();
                        isFirstLoad = false;
                        showToast("Waking up AI backend...");
                    }
                }, 5000);
            }
            try {
                // Show cached tasks immediately
                if (isFirstLoad) {
                    const cached = localStorage.getItem(`tasks_${selectedDate}`);
                    if (cached) {
                        tasks = JSON.parse(cached);
                        renderTasks();
                    }
                }

                const res = await fetch(`${API_URL}/tasks?date=${selectedDate}`);
                if (!res.ok) throw new Error('Failed to fetch tasks');
                tasks = await res.json();
                
                // Cache the results
                localStorage.setItem(`tasks_${selectedDate}`, JSON.stringify(tasks));
                
                renderTasks();
                retryCount = 0; // reset on success
                
                if (isFirstLoad) {
                    isFirstLoad = false;
                    hideLoading();
                }
            } catch (err) {
                console.error('Error fetching tasks from', API_URL, ':', err);
                if (API_URL === "http://127.0.0.1:5000") {
                    console.log("Local server unreachable, falling back to live cloud backend...");
                    API_URL = "https://focus-flow-gdii.onrender.com";
                    setTimeout(fetchTasks, 500);
                    return;
                }
                if (isFirstLoad) {
                    hideLoading();
                    isFirstLoad = false;
                }
                if (retryCount < 3) {
                    retryCount++;
                    showToast(`Connecting to AI backend... (${retryCount}/3)`);
                    setTimeout(fetchTasks, 3000);
                } else {
                    showToast('Offline Mode: Using cached tasks.');
                }
            }
        }

        window.toggleTask = async (id) => {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            task.completed = !task.completed;
            renderTasks();
            try {
                await fetch(`${API_URL}/tasks/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ completed: task.completed })
                });
            } catch (err) {
                console.error(err);
                task.completed = !task.completed;
                renderTasks();
            }
        };

        function renderTasks() {
            const list = document.getElementById('task-list');
            let filtered = tasks.filter(t => t.assignedDate === selectedDate)
                .sort((a, b) => b.pinned - a.pinned || a.completed - b.completed);

            if (filterMode === 'pending') filtered = filtered.filter(t => !t.completed);
            if (filterMode === 'completed') filtered = filtered.filter(t => t.completed);

            list.innerHTML = filtered.length ? '' : '<p style="text-align:center; opacity:0.3; margin-top:50px;">No missions found.</p>';

            filtered.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-card ${task.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div class="check-circle ${task.completed ? 'checked' : ''}" onclick="toggleTask('${task.id}')">
                        ${task.completed ? '<i data-lucide="check" size="16"></i>' : ''}
                    </div>
                    <div class="task-content"><span class="task-text">${task.text}</span></div>
                    <div class="actions">
                        <button class="action-btn" onclick="deleteTask('${task.id}')"><i data-lucide="trash-2" size="16"></i></button>
                    </div>
                `;
                list.appendChild(li);
            });
            updateStats();
            lucide.createIcons();

            if (window.taskSortable) {
                window.taskSortable.destroy();
            }
            window.taskSortable = new Sortable(list, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: function(evt) {
                    const movedItem = filtered.splice(evt.oldIndex, 1)[0];
                    filtered.splice(evt.newIndex, 0, movedItem);
                }
            });
        }

        function updateStats() {
            const current = tasks.filter(t => t.assignedDate === selectedDate);
            document.getElementById('stat-total').innerText = current.length;
            document.getElementById('stat-pending').innerText = current.filter(t => !t.completed).length;
            document.getElementById('stat-done').innerText = current.filter(t => t.completed).length;
        }

        async function addTask() {
            const inp = document.getElementById('task-input');
            const val = inp.value.trim();

            if (!val) {
                showToast('Please enter a task');
                inp.focus();
                return;
            }

            try {
                const res = await fetch(`${API_URL}/tasks`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text: val,
                        assignedDate: selectedDate
                    })
                });

                if (res.ok) {
                    inp.value = '';
                    inp.focus();
                    fetchTasks();
                    showToast("Task added! 🚀");
                } else {
                    const error = await res.json();
                    showToast(error.error || 'Failed to add task');
                }
            } catch (err) {
                console.error('Error adding task:', err);
                showToast('Network error. Check backend.');
            }
        }

        window.deleteTask = async (id) => {
            if (confirm('Delete this task?')) {
                try {
                    await fetch(`${API_URL}/tasks/${id}`, { method: "DELETE" });
                    fetchTasks();
                    showToast('Task deleted');
                } catch (err) {
                    console.error(err);
                    showToast('Error deleting task');
                }
            }
        };

        // ==================== CALENDAR FUNCTIONS ====================
        function renderCalendar() {
            const daysContainer = document.getElementById('calendar-days');
            const monthDisplay = document.getElementById('month-display');
            daysContainer.innerHTML = '';

            const year = calDate.getFullYear();
            const month = calDate.getMonth();
            monthDisplay.innerText = calDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Empty cells for days before month starts
            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.style.opacity = '0.3';
                daysContainer.appendChild(empty);
            }

            // Days of month
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                const dStr = formatDate(dateObj);
                const cell = document.createElement('div');
                cell.className = `cal-day-cell ${dStr === selectedDate ? 'selected' : ''}`;
                cell.innerText = d;
                cell.onclick = () => {
                    selectedDate = dStr;
                    document.getElementById('calendar-widget').style.display = 'none';
                    setupTimeline();
                    fetchTasks();
                    renderCalendar();
                };
                daysContainer.appendChild(cell);
            }
        }

        window.changeMonth = (dir) => {
            calDate.setMonth(calDate.getMonth() + dir);
            renderCalendar();
        };

        document.getElementById('toggle-calendar-btn').onclick = () => {
            const cw = document.getElementById('calendar-widget');
            const isHidden = cw.style.display === 'none' || !cw.style.display;
            cw.style.display = isHidden ? 'block' : 'none';
            if (isHidden) renderCalendar();
        };

        // ==================== COPY YESTERDAY & FILTERS ====================
        document.getElementById('copy-yesterday-to-today').onclick = async function () {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yestStr = formatDate(yesterday);
            const todayStr = formatDate(new Date());
            try {
                const res = await fetch(`${API_URL}/tasks?date=${yestStr}`);
                const prev = await res.json();
                const pending = prev.filter(t => !t.completed);
                if (!pending.length) { showToast("Nothing to copy!"); return; }
                await Promise.all(pending.map(t => fetch(`${API_URL}/tasks`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: t.text, assignedDate: todayStr })
                })));
                selectedDate = todayStr;
                fetchTasks();
                showToast("Copied! 📋");
            } catch (err) {
                console.error(err);
                showToast("Error copying");
            }
        };

        document.getElementById('filter-all').onclick = () => { filterMode = 'all'; renderTasks(); };
        document.getElementById('filter-pending').onclick = () => { filterMode = 'pending'; renderTasks(); };
        document.getElementById('filter-completed').onclick = () => { filterMode = 'completed'; renderTasks(); };

        // ==================== REPORT BUTTONS ====================
        document.getElementById('report-week-btn').onclick = () => generateReport('week');
        document.getElementById('report-month-btn').onclick = () => generateReport('month');
        document.getElementById('report-year-btn').onclick = () => generateReport('year');

        // ==================== KEYBOARD SHORTCUTS ====================
        document.getElementById('add-btn').onclick = addTask;
        document.getElementById('task-input').onkeydown = e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addTask();
            }
        };

        document.getElementById('task-input').onfocus = function () {
            this.select();
        };

        function applySuggest(tag) {
            document.getElementById('task-input').value = tag + " ";
            document.getElementById('task-input').focus();
        }

        // ==================== INITIALIZATION ====================
        lucide.createIcons();
        warmUpBackend();
        startClock();
        setupTimeline();
        fetchTasks();
    </script>
</body>

</html>
